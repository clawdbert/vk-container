name: Deploy vibe-kanban

on:
  push:
    branches:
      - dev
      - main

jobs:
  deploy:
    name: Deploy → ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Join tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret:    ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags:            tag:ci
          ephemeral:       true

      - name: Resolve instance and version
        id: vars
        run: |
          INSTANCE=$([[ "${{ github.ref_name }}" == "main" ]] && echo prod || echo dev)
          VERSION=$(cat VERSION 2>/dev/null || npm view vibe-kanban version)
          echo "instance=$INSTANCE" >> $GITHUB_OUTPUT
          echo "version=$VERSION"   >> $GITHUB_OUTPUT

      - name: Deploy to antfarm2
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.SANDBOXES_TS_HOST }}
          username: deploy
          key:      ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            bash /srv/vibe-kanban/deploy.sh \
              "${{ steps.vars.outputs.instance }}" \
              "${{ steps.vars.outputs.version }}" \
              "${{ secrets.TS_FQDN }}"
